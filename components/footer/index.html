<!DOCTYPE html>
<html lang="e">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <span id="actual-year"></span>
    <article id="sponsors-parent">
      <section class="sponsors-section" id="sponsors-primary"></section>
      <section class="sponsors-section" id="sponsors-secondary"></section>
      <section class="sponsors-section" id="sponsors-others"></section>

      <!-- autogenerated-->
      <!--
      <a class="company-link" href="https://eu3a.mitsubishielectric.com/" target="_blank">
        <img class="company-logo" src="./images/mitsubishii.png" alt="Logo de MITSUBISHI ELECTRIC AUTOMATIZACIÓN INDUSTRIAL" height="100" loading="lazy">
      </a>  

                  background: linear-gradient(180deg, #000000 0%, transparent 100%);

      -->
    </article>

    <style>
      #sponsors-primary img {
        height: auto;
        max-width: 500px;
      }

      #sponsors-secondary img {
        height: auto;
        width: 300px;
      }
      #sponsors-others img {
        height: auto;
        width: 150px;
      }
      #sponsors-parent {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .sponsors-section {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        a {
          padding: 20px;
          background: linear-gradient(180deg, #00000060 0%, transparent 100%);
        }
        img {
          transition: all 0.5s;
        }
        img:hover {
          transform: scale(1.1);
        }
      }

      body {
        font-family: "Mollen personal use", sans-serif;
        margin: 0px;
        background-color: black;
        background-image: url("");
        background-image: url("./images/pucra-timeline-2000x2829.png");
        background-size: cover;
      }
    </style>
    <script>
      const sponsors = {
        primary: [
          {
            name: "MITSUBISHI ELECTRIC AUTOMATIZACIÓN INDUSTRIAL",
            url: "https://eu3a.mitsubishielectric.com/",
            logo: "./images/mitsubishii.png",
            alt: "Logo de MITSUBISHI ELECTRIC AUTOMATIZACIÓN INDUSTRIAL",
          },
        ],
        secondary: [
          {
            name: "Schneider Electric",
            url: "https://www.se.com/",
            logo: "./images/Schneider-logo.png",
            alt: "Logo de Schneider Electric",
          },
          {
            name: "Mecalux",
            url: "https://www.mecalux.es/",
            logo: "./images/Mecalux-logo.png",
            alt: "Logo de Mecalux",
          },
        ],
        others: [
          {
            name: "Colegio de Ingenieros Industriales de Cataluña",
            url: "https://www.eic.cat/",
            logo: "./images/cole-logo.png",
            alt: "Logo del Colegio de Ingenieros Industriales de Cataluña",
          },
          {
            name: "La Mutua de los Ingenieros",
            url: "https://www.mutua-ingenieros.com/",
            logo: "./images/Mutua-logo.png",
            alt: "Logo de La Mutua de los Ingenieros",
          },
        ],
      };

      const parentFooter =
        document.getElementsByTagName("footer")[
          document.getElementsByTagName("footer").length - 1
        ];
      const sponsorsPrimary = document.getElementById("sponsors-primary");
      const sponsorsSecondary = document.getElementById("sponsors-secondary");
      const sponsorOthers = document.getElementById("sponsors-others");

      sponsors.primary.forEach((sponsor) => {
        const link = document.createElement("a");
        link.className = "company-link";
        link.href = sponsor.url;
        link.target = "_blank";
        const img = document.createElement("img");
        img.className = "company-logo";
        img.src = sponsor.logo;
        img.alt = sponsor.alt;
        // img.width = sponsor.width;

        img.loading = "lazy";
        link.appendChild(img);
        sponsorsPrimary.appendChild(link);
      });

      sponsors.secondary.forEach((sponsor) => {
        const link = document.createElement("a");
        link.className = "company-link";
        link.href = sponsor.url;
        link.target = "_blank";
        const img = document.createElement("img");
        img.className = "company-logo";
        img.src = sponsor.logo;
        img.alt = sponsor.alt;
        // img.width = sponsor.width;

        img.loading = "lazy";
        link.appendChild(img);
        sponsorsSecondary.appendChild(link);
      });

      sponsors.others.forEach((sponsor) => {
        const link = document.createElement("a");
        link.className = "company-link";
        link.href = sponsor.url;
        link.target = "_blank";
        const img = document.createElement("img");
        img.className = "company-logo";
        img.src = sponsor.logo;
        img.alt = sponsor.alt;
        // img.width = sponsor.width;

        img.loading = "lazy";
        link.appendChild(img);
        sponsorOthers.appendChild(link);
      });
    </script>
  </body>
</html>
